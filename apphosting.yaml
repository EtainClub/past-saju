# Firebase App Hosting runtime configuration.
# Backend: past-saju (project: pastsaju, region: asia-east1)
# The backend association itself is managed by Firebase, not by this file.
#
# 값이 없으면 코드가 **조용히 안전한 쪽으로** 떨어진다:
#   ANTHROPIC_API_KEY 없음  → LLM 전부 비활성, 패턴 + 템플릿만
#   LLM_RENDER_ENABLED≠true → 템플릿 렌더링
#   APP_CHECK_MODE 미지정   → 운영에서 monitor (검증하되 차단 안 함)
# 설정이 빠져도 장애가 아니라 **기능 미동작**으로 나타난다. 배포 후
# internalMetrics 로 실제 경로가 도는지 확인할 것.

runConfig:
  minInstances: 0

env:
  # ── 저장소 ──────────────────────────────────────────────────────────
  # 운영은 Firestore 를 강제한다. 연결 실패 시 메모리로 조용히 대체하지 않고
  # 503 을 낸다 — 세션이 사라지는 것보다 안 열리는 게 낫다.
  - variable: FIREBASE_STORAGE_BACKEND
    value: firestore
    availability: [RUNTIME]

  # ── 남용 방지 ───────────────────────────────────────────────────────
  # monitor: 토큰을 검증하되 없거나 틀려도 통과시키고 로그만 남긴다.
  # 클라이언트 사이트 키가 아직 없어 토큰이 안 오므로, enforce 로 올리면
  # 정상 사용자가 전부 401 을 받는다. 로그가 깨끗해진 뒤에 올릴 것.
  - variable: APP_CHECK_MODE
    value: monitor
    availability: [RUNTIME]

  # X-Forwarded-For 에서 뒤에서 몇 번째를 클라이언트로 볼지.
  # ⚠ App Hosting 은 Google LB 뒤에 있어 홉 수가 로컬과 다를 수 있다.
  # 값이 어긋나면 **모든 요청이 한 키로 묶여 과차단**된다. 배포 직후 429
  # 발생률을 반드시 확인할 것 — README 남용 방지 절 참조.
  - variable: RATE_LIMIT_XFF_DEPTH
    value: "1"
    availability: [RUNTIME]

  # ── 토스 미니앱 ─────────────────────────────────────────────────────
  # 미니앱은 정적 번들이라 API 를 이 서버로 교차 출처 호출한다. 여기 없으면
  # 화면은 뜨는데 사주 풀이만 안 나온다 — 브라우저가 응답을 버린다.
  #
  # minion.toss.im 은 토스가 미니앱을 얹는 공용 호스트다. 앱마다 경로가
  # 다르지만(ifsaju 는 /FNsxif4r) **Origin 은 경로를 포함하지 않으므로**
  # 호스트까지만 적는다.
  #
  # ⚠ 공용 호스트라 다른 미니앱과 출처를 공유한다. 이 허용이 곧 "토스
  # 미니앱 전체"를 여는 것과 같다는 뜻이다. 그래서 이 출처로 들어오는
  # 요청도 App Check 와 속도 제한을 그대로 지난다 — CORS 는 방어선이
  # 아니라 브라우저 편의일 뿐이다.
  - variable: TOSS_ALLOWED_ORIGINS
    value: https://minion.toss.im
    availability: [RUNTIME]

  # ── LLM ────────────────────────────────────────────────────────────
  # 킬스위치. 사고 시 이 값만 false 로 바꿔 재배포하면 전 경로가 템플릿으로
  # 돌아간다. 코드 변경 없이 멈출 수 있어야 한다.
  - variable: LLM_ENABLED
    value: "true"
    availability: [RUNTIME]

  # 일일 호출 상한. 세션당 약 $0.014 이므로 500 호출이면 하루 최대 $10 안팎
  # (docs/WORLDMODEL.md §5.E). 예산을 세지 못하면 호출하지 않는다(fail-closed).
  - variable: LLM_DAILY_CALL_BUDGET
    value: "500"
    availability: [RUNTIME]

  # 층별 모델. 실측 근거는 §5.D.
  #   L2 = 분류. 스키마·발췌 검증이 코드에 있어 헐거운 모델도 틀린 채로 못 지난다
  #   L5 = 서사. Opus 와 충실성 같고 33% 빠르다
  - variable: LLM_MODEL_L2
    value: claude-haiku-4-5-20251001
    availability: [RUNTIME]
  - variable: LLM_MODEL_L5
    value: claude-sonnet-5
    availability: [RUNTIME]

  # L5 LLM 렌더링 활성. 끄면 결정론 템플릿만 나간다.
  - variable: LLM_RENDER_ENABLED
    value: "true"
    availability: [RUNTIME]

  # 노출 비율. 세션 id 해시 기준이라 **같은 세션은 항상 같은 경로**를 탄다
  # (재열람 시 카드 내용이 바뀌면 안 된다).
  #
  # 1.0 — 전면 노출 (2026-08-17 상향).
  #
  # 0.25 로 시작했다가 되돌렸다. 근거는 "방향 반전 검사가 없다"(§6-11)였는데
  # 저울이 안 맞았다 — **확실한 품질 저하를 75%에 주면서 낮은 확률의 위험을
  # 피하는** 거래였다. 템플릿 경로는 사용자 원문을 한 글자도 인용하지 않아,
  # M2 이전 상태(카테고리 치환 한 번)와 같다. 그걸 없애려고 M2를 한 것이다.
  #
  # 안전망은 그대로다: 충실성 검사 실패 시 템플릿 폴백, 일일 호출 상한,
  # LLM_ENABLED=false 킬스위치.
  - variable: LLM_RENDER_SAMPLE
    value: "1.0"
    availability: [RUNTIME]

  # ── 클라이언트 Firebase (브라우저 번들에 포함됨) ──────────────────────
  # NEXT_PUBLIC_* 는 빌드 시점에 번들에 박히므로 BUILD 가용성이 필요하다.
  # RUNTIME 만 주면 빌드된 번들에 값이 없어 조용히 비활성화된다.
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: pastsaju
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: pastsaju.firebaseapp.com
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: pastsaju.firebasestorage.app
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "795988948217"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID
    value: G-2CWL51SRVY
    availability: [BUILD, RUNTIME]

  # ── 비밀값 (Secret Manager) ─────────────────────────────────────────
  # 이 파일에 값을 적지 않는다. 다음으로 등록한다:
  #   firebase apphosting:secrets:set <이름> --project pastsaju
  #
  # NEXT_PUBLIC_* 두 개는 브라우저에 노출되는 공개 값이지만, 저장소에
  # 자격증명처럼 보이는 문자열을 남기지 않으려고 함께 Secret 으로 둔다.
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    secret: NEXT_PUBLIC_FIREBASE_API_KEY
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    secret: NEXT_PUBLIC_FIREBASE_APP_ID
    availability: [BUILD, RUNTIME]

  # reCAPTCHA Enterprise 사이트 키. 이게 있어야 클라이언트가 App Check
  # 토큰을 발급한다. 없으면 조용히 비활성화되고 방어는 속도 제한뿐이다.
  # 브라우저에 노출되는 공개 값이지만 다른 키들과 같은 자리에 둔다.
  - variable: NEXT_PUBLIC_FIREBASE_APP_CHECK_SITE_KEY
    secret: NEXT_PUBLIC_FIREBASE_APP_CHECK_SITE_KEY
    availability: [BUILD, RUNTIME]

  # 없으면 LLM 전 경로가 비활성화된다(오류가 아니라 템플릿 폴백).
  - variable: ANTHROPIC_API_KEY
    secret: ANTHROPIC_API_KEY
    availability: [RUNTIME]

# ── 배포 후 순서대로 확인할 것 ────────────────────────────────────────
# 1. App Check 로그 — 사이트 키가 붙었으므로 토큰이 올라오기 시작한다.
#    "missing" 이 사라지고 "ok" 만 남으면 APP_CHECK_MODE 를 enforce 로 올린다.
#    지금 올리면 캐시된 구버전 클라이언트가 401 을 받는다.
# 2. 429 발생률 — RATE_LIMIT_XFF_DEPTH 가 App Hosting 홉 수와 맞는지.
#    어긋나면 모든 요청이 한 키로 묶여 과차단된다.
# 3. internalMetrics — forkSource_*, renderSucceeded, renderFallback_*.
#    LLM 경로가 실제로 도는지, 폴백률이 얼마인지.
# 4. "CORS 미허용 출처" 로그 — 토스 앱을 한 번 열어 본 뒤 이게 안 찍히면
#    위 TOSS_ALLOWED_ORIGINS 가 맞은 것이다. 찍히면 거기 적힌 값이 진짜다.
